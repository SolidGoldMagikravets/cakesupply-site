<!DOCTYPE html>
<html>
  <head>
  <meta charset="UTF-8">
  <title>Cake Supply</title>
  <link rel="icon" href="pixilart-drawing.png">
  <link rel="stylesheet" href="style.css?v=gallery-vote-barn">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>

  <body>

    <div class="site-header">
      <div class="header-tab-group header-tab-group-left">
        <button type="button" class="menu-tab" id="menu-tab">Menu</button>
        <button type="button" class="gallery-tab" id="gallery-tab">Gallery</button>
      </div>
      <div class="logo-lockup">
        <img src="primarylogo.jpg" alt="Cake Supply" class="landing-logo" id="site-logo">
        <a class="phone-icon-link" href="tel:+14422224236" aria-label="Call Cake Supply at +1 442 222 4236">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M6.6 3.8 4.7 5.7c-.5.5-.7 1.2-.5 1.9 1.3 5.3 6.9 10.9 12.2 12.2.7.2 1.4 0 1.9-.5l1.9-1.9c.4-.4.4-1 0-1.4l-3-3c-.4-.4-1-.4-1.4 0l-1.4 1.4c-2.2-1-3.8-2.6-4.8-4.8L11 8.2c.4-.4.4-1 0-1.4l-3-3c-.4-.4-1-.4-1.4 0Z"></path>
          </svg>
        </a>
      </div>
      <div class="header-tab-group header-tab-group-right">
        <button type="button" class="display-case-tab" id="display-case-tab">Live Display Case</button>
        <button type="button" class="order-tab" id="order-tab">Order</button>
      </div>
    </div>

    <div id="landing-page">
      <div id="results-stage" class="results-stage">
        <div class="cake-3d-wrap">
          <div id="landing-cake-hero" class="landing-cake-hero" aria-hidden="true"></div>
          <div id="calculator-ui">
            <form class="calculator-search-row" action="javascript:void(0);">
              <input
                type="number"
                id="guest-count"
                placeholder="How many servings?"
                aria-label="How many servings?">

              <button id="calculate-btn" type="submit" aria-label="Find cake size">→</button>
            </form>
          </div>
          <div id="hero-recommendation-meta" class="hero-recommendation-meta" aria-hidden="true">
            <div id="hero-recommendation-label" class="visual-label"></div>
            <button id="hero-customize-btn" class="customize-btn" type="button">Customize</button>
          </div>
        </div>
        <div id="recommendations-page">
          <div class="recommendations-header">
            <button id="recommendations-back-btn" class="back-btn recommendations-back-btn" type="button">← Back</button>
          </div>
          <div id="cake-visuals"></div>
        </div>
      </div>
    </div>
    <div id="menu-page" aria-labelledby="menu-page-title" hidden>
      <div class="menu-page-shell">
        <div id="menu-grid" class="menu-grid"></div>
      </div>
    </div>
    <div id="gallery-page" aria-labelledby="gallery-page-title" hidden>
      <div class="gallery-page-shell">
        <h1 id="gallery-page-title" class="gallery-title">Gallery</h1>
        <div class="gallery-grid">
          <figure class="gallery-item">
            <img src="votebarn.jpeg" alt="Vote barn cake" class="gallery-image">
            <figcaption>vote barn</figcaption>
          </figure>
        </div>
      </div>
    </div>
    <div id="display-case-page" aria-labelledby="display-case-page-title" hidden>
      <div class="display-case-shell">
        <h1 id="display-case-page-title" class="display-case-title">Live Display Case</h1>
        <div class="display-case-illustration" aria-hidden="true">
          <div class="display-case-glass">
            <div class="display-case-back"></div>
            <div class="display-case-side display-case-side-left"></div>
            <div class="display-case-side display-case-side-right"></div>
            <div class="display-case-shelf display-case-shelf-top"></div>
            <div class="display-case-shelf display-case-shelf-middle"></div>
            <div class="display-case-shelf display-case-shelf-bottom"></div>
            <div class="display-case-light display-case-light-top"></div>
            <div class="display-case-light display-case-light-middle"></div>
            <div class="display-case-light display-case-light-bottom"></div>
          </div>
          <div class="display-case-base">
            <div class="display-case-vent"></div>
          </div>
          <div class="display-case-foot"></div>
        </div>
      </div>
    </div>
<div id="customizer" style="display: none;"></div>

<script type="module" src="script.js?v=gallery-vote-barn"></script>
</body>
</html>
