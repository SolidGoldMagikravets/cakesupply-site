<!DOCTYPE html>
<html>
  <head>
  <meta charset="UTF-8">
  <title>Cake Supply</title>
  <link rel="icon" href="pixilart-drawing.png">
  <link rel="stylesheet" href="style.css?v=ombre-mesh-1">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>

  <body class="password-gate-locked">

    <!-- PASSWORD GATE: Remove this section when launching the public site. -->
    <div id="password-gate" class="password-gate" role="dialog" aria-modal="true" aria-label="Cake Supply">
      <form id="password-gate-form" class="password-gate-card" action="javascript:void(0);">
        <img src="logo_transparent.png" alt="Cake Supply" class="password-gate-logo">
        <div class="password-gate-composition">
          <div id="password-gate-cake" class="password-gate-cake" aria-hidden="true"></div>
          <div class="password-gate-controls">
            <input
              type="password"
              id="password-gate-input"
              class="password-gate-input"
              placeholder="Password"
              aria-label="Password"
              autocomplete="current-password"
              required>
            <button id="password-gate-submit" class="password-gate-submit" type="submit" aria-label="Enter password">→</button>
          </div>
        </div>
        <p>new website coming soon</p>
        <p id="password-gate-error" class="password-gate-error" role="alert" aria-live="polite"></p>
      </form>
    </div>
    <!-- END PASSWORD GATE -->

    <div class="site-header">
      <div class="logo-lockup">
        <img src="monogram_1.png" alt="Cake Supply" class="landing-logo" id="site-logo">
      </div>
      <nav class="header-tab-group header-nav" aria-label="Primary navigation">
        <button type="button" class="menu-tab" id="menu-tab">Menu</button>
        <button type="button" class="gallery-tab" id="gingerbread-tab">Gingerbread</button>
      </nav>
      <div class="header-actions">
        <button type="button" class="display-case-tab" id="display-case-tab">Live Display Case</button>
        <button type="button" class="order-tab" id="order-tab">Order</button>
      </div>
    </div>

    <div id="home-page" aria-label="Cake Supply">
      <section class="home-page-shell home-hero" aria-label="Cake Supply">
        <div class="home-hero-composition">
          <div class="home-hero-candles" aria-hidden="true">
            <div class="ascii-candle home-hero-candle home-hero-candle-left"></div>
            <div class="ascii-candle home-hero-candle home-hero-candle-center"></div>
            <div class="ascii-candle home-hero-candle home-hero-candle-right"></div>
          </div>
          <img src="BirthdayHero1.png" alt="" class="home-hero-cake">
          <div class="home-hero-overlay">
            <a href="#home-how-to-order" class="home-hero-how-to-order">
              <span>How to Order</span>
              <span class="home-hero-arrow" aria-hidden="true">↓</span>
            </a>
          </div>
        </div>
      </section>
      <section id="home-how-to-order" class="home-next-section" aria-label="How to order">
        <div class="how-to-order-stage">
          <div class="how-to-order-sticky">
            <div class="home-hero-how-to-order how-to-order-stage-heading">
              <span>How to Order</span>
              <span class="home-hero-arrow" aria-hidden="true">↓</span>
            </div>
            <div class="how-to-order-visual-stage" data-active-step="0">
              <div class="how-to-order-step-label" aria-live="polite">
                <span id="how-to-order-step-number">01</span>
                <span aria-hidden="true">/</span>
                <span id="how-to-order-step-title">Cake Size</span>
              </div>
              <div id="how-to-order-cake-3d" class="how-to-order-cake-3d" aria-hidden="true"></div>
              <div id="how-to-order-serving-count" class="how-to-order-serving-count">12 servings</div>
              <p id="how-to-order-step-copy" class="how-to-order-step-copy">How many people are you serving?</p>
              <div class="how-to-order-step-progress" aria-hidden="true">
                <span id="how-to-order-step-progress-bar"></span>
              </div>
            </div>
          </div>
          <div class="how-to-order-scroll-space" aria-hidden="true"></div>
        </div>
      </section>
    </div>

    <div id="landing-page" style="display: none;">
      <div id="results-stage" class="results-stage">
        <div class="cake-3d-wrap">
          <div id="landing-cake-hero" class="landing-cake-hero" aria-hidden="true"></div>
          <div id="calculator-ui">
            <form class="calculator-search-row" action="javascript:void(0);">
              <label class="calculator-range-control servings-range-control" for="servings-slider">
                <span>Servings</span>
                <input
                  type="range"
                  id="servings-slider"
                  min="10"
                  max="250"
                  step="1"
                  value="10"
                  aria-label="Servings">
              </label>
              <input
                type="number"
                id="guest-count"
                min="10"
                max="250"
                placeholder="How many servings?"
                aria-label="How many servings?">

              <label class="calculator-range-control price-range-control" for="price-slider">
                <span>Price <strong id="price-slider-value">$0</strong></span>
                <input
                  type="range"
                  id="price-slider"
                  min="0"
                  max="0"
                  step="5"
                  value="0"
                  aria-label="Desired budget">
              </label>
              <button id="calculate-btn" type="submit" aria-label="Find cake size">→</button>
            </form>
          </div>
          <div id="hero-recommendation-meta" class="hero-recommendation-meta" aria-hidden="true">
            <div id="hero-recommendation-label" class="visual-label"></div>
            <button id="hero-customize-btn" class="customize-btn" type="button">Customize</button>
          </div>
        </div>
        <a class="landing-email-link" href="mailto:info@cakesupply.store" aria-label="Email Cake Supply at info@cakesupply.store">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 6.5h16v11H4z"></path>
            <path d="m4.8 7.2 7.2 5.6 7.2-5.6"></path>
          </svg>
          <span>info@cakesupply.store</span>
        </a>
        <div id="recommendations-page">
          <div class="recommendations-header">
            <button id="recommendations-back-btn" class="back-btn recommendations-back-btn" type="button">← Back</button>
          </div>
          <div id="cake-visuals"></div>
        </div>
      </div>
    </div>
    <div id="menu-page" aria-labelledby="menu-page-title" hidden>
      <div class="menu-page-shell">
        <div id="menu-grid" class="menu-grid"></div>
      </div>
    </div>
    <div id="gallery-page" aria-labelledby="gallery-page-title" hidden>
      <div class="gallery-page-shell">
        <h1 id="gallery-page-title" class="gallery-title">Gingerbread</h1>
        <div class="gallery-grid">
          <figure class="gallery-item">
            <img src="votebarn.jpeg" alt="Vote barn cake" class="gallery-image">
            <figcaption>vote barn</figcaption>
            <div id="vote-barn-candle" class="ascii-candle" aria-label="Animated ASCII birthday candle"></div>
          </figure>
        </div>
      </div>
    </div>
    <div id="display-case-page" aria-labelledby="display-case-page-title" hidden>
      <div class="display-case-shell">
        <h1 id="display-case-page-title" class="display-case-title">Live Display Case</h1>
        <div class="display-case-illustration" aria-hidden="true">
          <div class="display-case-glass">
            <div class="display-case-back"></div>
            <div class="display-case-side display-case-side-left"></div>
            <div class="display-case-side display-case-side-right"></div>
            <div id="display-case-daily-cakes" class="display-case-daily-cakes"></div>
            <div class="display-case-shelf display-case-shelf-top"></div>
            <div class="display-case-shelf display-case-shelf-middle"></div>
            <div class="display-case-shelf display-case-shelf-bottom"></div>
            <div class="display-case-light display-case-light-top"></div>
            <div class="display-case-light display-case-light-middle"></div>
            <div class="display-case-light display-case-light-bottom"></div>
          </div>
          <div class="display-case-base">
            <div class="display-case-vent"></div>
          </div>
          <div class="display-case-foot"></div>
        </div>
        <div id="display-case-daily-info" class="display-case-daily-info"></div>
      </div>
    </div>
<div id="customizer" style="display: none;"></div>

<!-- PASSWORD GATE: Remove this script when launching the public site. -->
<script>
  (function () {
    var PASSWORD_GATE_VALUE = "Lou42";
    var PASSWORD_GATE_SESSION_KEY = "cake-supply-password-gate-unlocked";
    var gate = document.getElementById("password-gate");
    var form = document.getElementById("password-gate-form");
    var input = document.getElementById("password-gate-input");
    var error = document.getElementById("password-gate-error");

    function unlockGate() {
      document.body.classList.remove("password-gate-locked");
      gate.setAttribute("hidden", "");
      input.value = "";
      error.textContent = "";
    }

    if (!gate || !form || !input || !error) {
      document.body.classList.remove("password-gate-locked");
      return;
    }

    if (sessionStorage.getItem(PASSWORD_GATE_SESSION_KEY) === "true") {
      unlockGate();
      return;
    }

    input.focus();

    form.addEventListener("submit", function () {
      if (input.value === PASSWORD_GATE_VALUE) {
        sessionStorage.setItem(PASSWORD_GATE_SESSION_KEY, "true");
        unlockGate();
        return;
      }

      input.value = "";
      error.textContent = "Incorrect password.";
      input.focus();
    });
  }());
</script>
<!-- END PASSWORD GATE -->

<script src="pricing.js"></script>
  <script type="module" src="script.js?v=ombre-mesh-1"></script>
</body>
</html>
